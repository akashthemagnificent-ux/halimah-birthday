<div class="physics__content">
  <p class="physics__eyebrow">bonus corner</p>
  <h2 class="physics__headline">shove a heart</h2>
  <p class="physics__lede">drag any heart &mdash; they knock into each other, gently</p>

  <div class="physics__stage" data-physics-stage>
    <div class="physics__static" data-physics-static data-testid="physics-static" hidden>
      <ul class="physics__chips" data-physics-chips data-testid="physics-chips"></ul>
      <p class="physics__note" data-physics-note data-testid="physics-note"></p>
    </div>
  </div>

  <button class="physics__play" type="button" data-physics-play data-testid="physics-play" hidden>
    let them float
  </button>
  <p class="physics__status" role="status" data-physics-status data-testid="physics-status"></p>
</div>
